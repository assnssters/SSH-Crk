name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            ext: .exe
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ""
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Collect binaries
        shell: bash
        run: |
          mkdir -p dist
          for bin in $(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].targets[] | select(.kind | index("bin")) | .name' \
            | tr -d '\r'); do
            cp "target/${{ matrix.target }}/release/${bin}${{ matrix.ext }}" \
               "dist/${bin}-${{ matrix.name }}${{ matrix.ext }}"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
